ps://openstax.org/books/biology-2e/pages/40-review-questions"},{"id":"p084","chapter":42,"kind":"public","question":"Most transported CO₂ in human blood is present as…","options":["Bicarbonate","Dissolved oxygen","Solid carbon"],"correct":0,"explanation":"CO₂ is converted largely to bicarbonate ions.","os":39,"sourceQuestion":14,"url":"https://openstax.org/books/biology-2e/pages/39-review-questions"},{"id":"p085","chapter":43,"kind":"public","question":"Reactivated memory B cells can become antibody-secreting…","options":["Plasma cells","Red blood cells","Platelets"],"correct":0,"explanation":"Plasma cells secrete antigen-specific antibodies.","os":42,"sourceQuestion":12,"url":"https://openstax.org/books/biology-2e/pages/42-review-questions"},{"id":"p086","chapter":43,"kind":"public","question":"Maternal antibodies transferred to an infant provide…","options":["Passive protection","The infant's own vaccination response","Autoimmunity"],"correct":0,"explanation":"Protection comes from another individual's antibodies.","os":42,"sourceQuestion":17,"url":"https://openstax.org/books/biology-2e/pages/42-review-questions"},{"id":"p087","chapter":44,"kind":"public","question":"A cell placed in a strongly hypertonic solution tends to…","options":["Lose water","Gain water","Double its chromosomes"],"correct":0,"explanation":"Water moves toward greater effective solute concentration.","os":41,"sourceQuestion":6,"url":"https://openstax.org/books/biology-2e/pages/41-review-questions"},{"id":"p088","chapter":44,"kind":"public","question":"Humans excrete much of their nitrogen waste as…","options":["Urea","Uric acid only","Ammonia gas"],"correct":0,"explanation":"Urea carries nitrogen with reduced toxicity.","os":41,"sourceQuestion":14,"url":"https://openstax.org/books/biology-2e/pages/41-review-questions"},{"id":"p089","chapter":45,"kind":"public","question":"Which hormones often cross membranes and bind intracellular receptors?","options":["Steroids","Large peptides","Proteins universally"],"correct":0,"explanation":"Lipid solubility permits membrane entry.","os":37,"sourceQuestion":5,"url":"https://openstax.org/books/biology-2e/pages/37-review-questions"},{"id":"p090","chapter":45,"kind":"public","question":"Pancreatic beta cells secrete which glucose-regulating signal?","options":["Insulin","Glucagon","Aldosterone"],"correct":0,"explanation":"Insulin generally promotes glucose uptake and storage.","os":37,"sourceQuestion":12,"url":"https://openstax.org/books/biology-2e/pages/37-review-questions"},{"id":"p091","chapter":46,"kind":"public","question":"Where does sperm formation occur in the testes?","options":["Seminiferous tubules","Prostate ducts","Seminal vesicles"],"correct":0,"explanation":"Developing sperm arise within these tubules.","os":43,"sourceQuestion":11,"url":"https://openstax.org/books/biology-2e/pages/43-review-questions"},{"id":"p092","chapter":46,"kind":"public","question":"Which pituitary hormone surge triggers ovulation?","options":["LH","ADH","TSH"],"correct":0,"explanation":"The LH surge promotes egg release.","os":43,"sourceQuestion":19,"url":"https://openstax.org/books/biology-2e/pages/43-review-questions"},{"id":"p093","chapter":47,"kind":"public","question":"Early cleavage typically changes cell number while total embryo volume…","options":["Stays roughly similar","Doubles each division","Falls to zero"],"correct":0,"explanation":"Cleavage partitions existing cytoplasm.","os":43,"sourceQuestion":28,"url":"https://openstax.org/books/biology-2e/pages/43-review-questions"},{"id":"p094","chapter":47,"kind":"public","question":"Which germ layer produces the epidermis?","options":["Ectoderm","Endoderm","Mesoderm"],"correct":0,"explanation":"Ectoderm contributes outer covering and nervous tissue.","os":43,"sourceQuestion":29,"url":"https://openstax.org/books/biology-2e/pages/43-review-questions"},{"id":"p095","chapter":48,"kind":"public","question":"An action potential begins when depolarization reaches…","options":["Threshold","Absolute zero","Any arbitrary voltage"],"correct":0,"explanation":"Threshold recruits regenerative channel opening.","os":35,"sourceQuestion":8,"url":"https://openstax.org/books/biology-2e/pages/35-review-questions"},{"id":"p096","chapter":48,"kind":"public","question":"Which ion efflux helps repolarize a typical neuronal action potential?","options":["K⁺","Ca²⁺ alone","Cl⁻ leaving universally"],"correct":0,"explanation":"Potassium exits through voltage-gated channels.","os":35,"sourceQuestion":9,"url":"https://openstax.org/books/biology-2e/pages/35-review-questions"},{"id":"p097","chapter":49,"kind":"public","question":"Which cerebral lobe contains primary visual cortex?","options":["Occipital","Frontal","Temporal only"],"correct":0,"explanation":"Visual processing begins in occipital cortex.","os":35,"sourceQuestion":12,"url":"https://openstax.org/books/biology-2e/pages/35-review-questions"},{"id":"p098","chapter":49,"kind":"public","question":"What major tract links the two cerebral hemispheres?","options":["Corpus callosum","Optic lens","Cochlea"],"correct":0,"explanation":"Axons there connect the hemispheres.","os":35,"sourceQuestion":13,"url":"https://openstax.org/books/biology-2e/pages/35-review-questions"},{"id":"p099","chapter":50,"kind":"public","question":"Converting stimulus energy into receptor activity is sensory…","options":["Transduction","Digestion","Replication"],"correct":0,"explanation":"Receptors convert physical input into biological signals.","os":36,"sourceQuestion":5,"url":"https://openstax.org/books/biology-2e/pages/36-review-questions"},{"id":"p100","chapter":50,"kind":"public","question":"What covers actin's myosin-binding sites in relaxed skeletal muscle?","options":["Tropomyosin","Hemoglobin","Elastin"],"correct":0,"explanation":"Calcium-triggered changes expose the binding sites.","os":38,"sourceQuestion":20,"url":"https://openstax.org/books/biology-2e/pages/38-review-questions"},{"id":"p101","chapter":51,"kind":"public","question":"An animal improves maze navigation through experience. This demonstrates…","options":["Learning","Only inherited reflexes","Osmosis"],"correct":0,"explanation":"Experience changes subsequent behavior.","os":45,"sourceQuestion":26,"url":"https://openstax.org/books/biology-2e/pages/45-review-questions"},{"id":"p102","chapter":51,"kind":"public","question":"Helping relatives reproduce can increase which component of fitness?","options":["Indirect fitness","Only personal offspring count","Abiotic fitness"],"correct":0,"explanation":"Shared alleles connect kin success to inclusive fitness.","os":45,"sourceQuestion":28,"url":"https://openstax.org/books/biology-2e/pages/45-review-questions"},{"id":"p103","chapter":52,"kind":"public","question":"Which environmental influence is living?","options":["A fungal pathogen","Rainfall","Wind"],"correct":0,"explanation":"Biotic factors involve organisms.","os":44,"sourceQuestion":4,"url":"https://openstax.org/books/biology-2e/pages/44-review-questions"},{"id":"p104","chapter":52,"kind":"public","question":"An estuary is characterized by mixing…","options":["River water and seawater","Lava and ice","Only freshwater streams"],"correct":0,"explanation":"Mixing creates a variable salinity gradient.","os":44,"sourceQuestion":11,"url":"https://openstax.org/books/biology-2e/pages/44-review-questions"},{"id":"p105","chapter":53,"kind":"public","question":"Which growth model includes slowing as resources become limiting?","options":["Logistic","Unbounded exponential","Constant doubling forever"],"correct":0,"explanation":"Density dependence reduces per-capita growth.","os":45,"sourceQuestion":11,"url":"https://openstax.org/books/biology-2e/pages/45-review-questions"},{"id":"p106","chapter":53,"kind":"public","question":"The population an environment can sustain is its…","options":["Carrying capacity","Mutation rate","Trophic efficiency"],"correct":0,"explanation":"Resource supply constrains long-term abundance.","os":45,"sourceQuestion":13,"url":"https://openstax.org/books/biology-2e/pages/45-review-questions"},{"id":"p107","chapter":54,"kind":"public","question":"Several defended species share warning colors. Which mimicry is this?","options":["Müllerian","Batesian","Camouflage only"],"correct":0,"explanation":"Each defended species reinforces predator learning.","os":45,"sourceQuestion":23,"url":"https://openstax.org/books/biology-2e/pages/45-review-questions"},{"id":"p108","chapter":54,"kind":"public","question":"Both partners benefit from an association. This is…","options":["Mutualism","Parasitism","Competition"],"correct":0,"explanation":"The interaction has positive effects on both partners.","os":45,"sourceQuestion":24,"url":"https://openstax.org/books/biology-2e/pages/45-review-questions"},{"id":"p109","chapter":55,"kind":"public","question":"A snapshot of living material in an ecosystem measures…","options":["Biomass","Productivity per year","Respiration rate"],"correct":0,"explanation":"Biomass is a stock, not a rate.","os":46,"sourceQuestion":12,"url":"https://openstax.org/books/biology-2e/pages/46-review-questions"},{"id":"p110","chapter":55,"kind":"public","question":"A persistent toxin becomes more concentrated at higher feeding levels. This is…","options":["Biomagnification","Nitrogen fixation","Primary production"],"correct":0,"explanation":"Toxins can concentrate along food chains.","os":46,"sourceQuestion":13,"url":"https://openstax.org/books/biology-2e/pages/46-review-questions"},{"id":"p111","chapter":56,"kind":"public","question":"Crop pollination by wild animals illustrates…","options":["An ecosystem service","Only genetic drift","A fossil record"],"correct":0,"explanation":"Ecological processes can provide human benefits.","os":47,"sourceQuestion":10,"url":"https://openstax.org/books/biology-2e/pages/47-review-questions"},{"id":"p112","chapter":56,"kind":"public","question":"Wildlife trade can threaten species through collection and…","options":["Introduced populations","Reduced mutation universally","Extra photosynthesis"],"correct":0,"explanation":"Escaped traded organisms may become invasive.","os":47,"sourceQuestion":12,"url":"https://openstax.org/books/biology-2e/pages/47-review-questions"},{"id":"c001","chapter":1,"kind":"concept","question":"A fertilizer study uses one sunny fertilized plot and one shaded untreated plot. What prevents a causal conclusion?","options":["Light and fertilizer change together","Plants cannot be experimental subjects","Two variables always improve a control"],"correct":0,"explanation":"The treatment is confounded with light. Randomize replicated plots while holding other conditions comparable."},{"id":"c002","chapter":2,"kind":"concept","question":"A sodium atom loses an electron. What changes immediately?","options":["Its net charge","Its element identity","Its proton number"],"correct":0,"explanation":"Electron loss creates a positive ion; the proton count still identifies sodium."},{"id":"c003","chapter":3,"kind":"concept","question":"A lake freezes at the surface while liquid water remains below. Which molecular property helps explain this?","options":["Ice forms a more open hydrogen-bonded structure","Frozen water molecules become heavier","Covalent bonds disappear in liquid water"],"correct":0,"explanation":"The open crystal structure makes ice less dense. Floating ice can insulate liquid water below."},{"id":"c004","chapter":4,"kind":"concept","question":"Two molecules have the same formula but their mirror images cannot be superimposed. Why might only one activate a receptor?","options":["The binding site has a specific three-dimensional shape","One molecule has different elements","Mirror images always have different masses"],"correct":0,"explanation":"A chiral receptor may interact differently with two enantiomers despite their identical formula."},{"id":"c005","chapter":5,"kind":"concept","question":"Heating an enzyme abolishes activity without breaking its peptide backbone. Which level is certainly preserved?","options":["Amino acid sequence","The original active-site shape","All subunit interactions"],"correct":0,"explanation":"Denaturation disrupts folding; the primary sequence can remain intact even when function is lost."},{"id":"c006","chapter":6,"kind":"concept","question":"A secreted protein accumulates inside rough ER after Golgi transport is blocked. What is most directly disrupted?","options":["Delivery through the secretory pathway","DNA replication in the nucleus","ATP synthesis by every mitochondrion"],"correct":0,"explanation":"Secreted proteins pass through ER and Golgi before vesicles deliver them to the cell surface."},{"id":"c007","chapter":7,"kind":"concept","question":"A membrane passes water but not sucrose. One side has more sucrose. Initially, water tends to move…","options":["Toward the higher sucrose concentration","Toward the lower sucrose concentration","Equally with no net flow under all conditions"],"correct":0,"explanation":"With equal initial pressure, water moves toward the side with lower water potential. Pressure can eventually balance the osmotic effect."},{"id":"c008","chapter":8,"kind":"concept","question":"An enzyme is added to a closed reversible reaction already at equilibrium. What changes?","options":["Forward and reverse reactions become faster","The equilibrium shifts toward products","The overall reaction gains free energy"],"correct":0,"explanation":"Catalysis lowers activation barriers for both directions. It changes kinetics, not the equilibrium constant or overall ΔG."},{"id":"c009","chapter":9,"kind":"concept","question":"A compound makes the inner mitochondrial membrane freely permeable to protons. With fuel and oxygen available, what happens?","options":["ATP yield falls as the proton gradient dissipates","ATP synthase works indefinitely without a gradient","The citric acid cycle becomes photosynthesis"],"correct":0,"explanation":"Uncoupling allows electron transfer without efficient ATP production. Energy is dissipated, often as heat."},{"id":"c010","chapter":10,"kind":"concept","question":"Stomata close during a hot day. Why can photorespiration increase in a C₃ leaf?","options":["CO₂ falls relative to O₂ near rubisco","Rubisco stops binding oxygen entirely","The Calvin cycle begins producing photons"],"correct":0,"explanation":"Lower internal CO₂ favors rubisco's oxygenase reaction. This competes with productive carbon fixation."},{"id":"c011","chapter":11,"kind":"concept","question":"Two cell types encounter the same hormone but produce different responses. Best explanation?","options":["They differ in receptors or downstream machinery","The hormone must have different atoms in each tissue","All signals directly mutate DNA"],"correct":0,"explanation":"A signal's effect depends on the receiving cell's receptors, relay proteins, and targets."},{"id":"c012","chapter":12,"kind":"concept","question":"Every chromosome but one is attached correctly to the spindle. Why should anaphase wait?","options":["An unattached kinetochore can activate the spindle checkpoint","DNA synthesis needs to start again","The cell must become haploid before mitosis"],"correct":0,"explanation":"The checkpoint delays chromatid separation until chromosomes are properly attached, reducing segregation errors."},{"id":"c013","chapter":13,"kind":"concept","question":"After meiosis I, each daughter cell has one member of each homologous pair, still with two chromatids. It is…","options":["Haploid with duplicated chromosomes","Diploid because chromatids always count as homologs","Tetraploid until cytokinesis ends"],"correct":0,"explanation":"Ploidy counts chromosome sets, not chromatids or DNA molecules. Sister chromatids separate in meiosis II."},{"id":"c014","chapter":14,"kind":"concept","question":"Two unaffected parents have an affected child under a simple autosomal recessive model. What is the probability their next child is affected?","options":["One quarter","One half","Zero after the first affected child"],"correct":0,"explanation":"Both parents are carriers in this model. Each conception is an independent Aa × Aa event."},{"id":"c015","chapter":15,"kind":"concept","question":"A testcross gives 45% AB, 45% ab, 5% Ab, and 5% aB offspring. What is the estimated distance between loci?","options":["10 map units","5 map units","90 map units"],"correct":0,"explanation":"The two recombinant classes total 10%. For short intervals, percent recombination approximates map distance."},{"id":"c016","chapter":16,"kind":"concept","question":"Both new DNA strands grow 5′ to 3′. Why is one made in fragments at a replication fork?","options":["The parental strands are antiparallel","Polymerase changes direction every second","Only one strand has complementary bases"],"correct":0,"explanation":"Polymerase can extend only a 3′ end. Antiparallel templates require discontinuous synthesis on the lagging strand."},{"id":"c017","chapter":17,"kind":"concept","question":"One nucleotide is inserted near the beginning of a coding sequence. Why can many downstream amino acids change?","options":["The grouping into codons shifts","Every codon becomes the same nucleotide","All insertions leave translation unchanged"],"correct":0,"explanation":"A single-base insertion usually changes the reading frame unless compensated. A three-base insertion may preserve the downstream frame."},{"id":"c018","chapter":18,"kind":"concept","question":"A liver cell and a neuron have mostly the same DNA. Why do their proteomes differ?","options":["They regulate different genes and RNAs","They use different universal genetic codes","Neurons lack chromosomes"],"correct":0,"explanation":"Cell identity depends heavily on differential expression, RNA processing, and protein regulation."},{"id":"c019","chapter":19,"kind":"concept","question":"An antibiotic targets bacterial ribosomes. Why is it unlikely to stop an ordinary viral infection directly?","options":["Viruses lack their own ribosomes","All viruses are larger than bacteria","Antibiotics cannot enter any cells"],"correct":0,"explanation":"Viruses use host translation machinery. A bacterial ribosome-specific drug lacks the same target in viruses."},{"id":"c020","chapter":20,"kind":"concept","question":"PCR yields no product when one primer cannot bind. Why?","options":["Repeated copying requires correctly positioned extendable primers","DNA polymerase can copy only proteins","One primer normally destroys both templates"],"correct":0,"explanation":"Two primers define opposite ends of the target on complementary strands. Missing priming prevents normal exponential amplification."},{"id":"c021","chapter":21,"kind":"concept","question":"Two genes in one species arose from duplication of one ancestral gene. Their relationship is…","options":["Paralogy","Orthology between species","Unrelated chemical convergence"],"correct":0,"explanation":"Duplicated genes are paralogs. They may retain, divide, or acquire functions as mutations accumulate."},{"id":"c022","chapter":22,"kind":"concept","question":"A pesticide kills susceptible insects; resistant survivors leave more offspring. Which interpretation is supported?","options":["Selection changed the representation of inherited variants","The pesticide intentionally created exactly the needed allele","Each susceptible insect evolved during spraying"],"correct":0,"explanation":"Selection acts through differential reproductive success. It does not imply mutations arise because organisms need them."},{"id":"c023","chapter":23,"kind":"concept","question":"A storm randomly leaves ten survivors from a large population. An allele becomes common despite no survival advantage. This is…","options":["Genetic drift through a bottleneck","Directional selection proved by survival","Mutation guided by the storm"],"correct":0,"explanation":"A random sample can shift frequencies sharply when population size collapses."},{"id":"c024","chapter":24,"kind":"concept","question":"Two plant populations overlap geographically but flower in different months. Which barrier acts first?","options":["Temporal prezygotic isolation","Hybrid sterility after fertilization","A physical ocean barrier"],"correct":0,"explanation":"Different reproductive timing can prevent mating before zygotes form."},{"id":"c025","chapter":25,"kind":"concept","question":"Many lineages diversify after an extinction removes competitors. Which explanation is most plausible?","options":["Ecological opportunities permit adaptive radiation","Extinction guarantees directed progress","All surviving organisms acquire identical traits"],"correct":0,"explanation":"Vacated niches can allow surviving lineages to diversify, though opportunities do not guarantee every lineage radiates."},{"id":"c026","chapter":26,"kind":"concept","question":"Rotating two branches around a tree node changes the left-to-right tip order. What happens to relatedness?","options":["It stays the same","Every sister relationship reverses","The oldest species becomes youngest"],"correct":0,"explanation":"Relatedness is encoded by branching connections, not the visual order of tips."},{"id":"c027","chapter":27,"kind":"concept","question":"Resistance DNA moves from one bacterium to another through direct contact. Which process best fits?","options":["Conjugation","Mitosis","Translation"],"correct":0,"explanation":"Conjugation can transfer DNA between cells. Horizontal transfer can spread traits without waiting for parent-offspring descent."},{"id":"c028","chapter":28,"kind":"concept","question":"An alga contains a plastid surrounded by extra membranes and a remnant algal nucleus. What history does this suggest?","options":["Secondary endosymbiosis","De novo creation of a nucleus from sugar","A mitochondrion turning into a virus"],"correct":0,"explanation":"Engulfing a eukaryotic alga can produce a plastid with additional membranes and sometimes a nucleomorph."},{"id":"c029","chapter":29,"kind":"concept","question":"Why do many mosses still need surface water for sexual reproduction?","options":["Their flagellated sperm must reach eggs","All their spores swim","They lack any protection for embryos"],"correct":0,"explanation":"Moss sperm move through water to eggs. This is a reproductive constraint even though other adaptations permit life on land."},{"id":"c030","chapter":30,"kind":"concept","question":"Why is a pollen grain not equivalent to a seed?","options":["Pollen is a male gametophyte; a seed contains an embryo","Pollen always contains a diploid embryo","Seeds are haploid sperm cells"],"correct":0,"explanation":"Pollen participates before fertilization; the seed develops afterward and contains the next sporophyte generation."},{"id":"c031","chapter":31,"kind":"concept","question":"A fungus releases enzymes onto wood and then takes up small molecules. This is…","options":["External digestion followed by absorption","Photosynthesis without pigments","Ingestion into an animal stomach"],"correct":0,"explanation":"Fungal enzymes break down large substrates outside the body. Hyphae then absorb usable products."},{"id":"c032","chapter":32,"kind":"concept","question":"An adult sea star is radially symmetrical but its larva is bilateral. Why should classification consider more than the adult outline?","options":["Development and shared derived traits reveal ancestry","Larvae cannot provide evolutionary evidence","Radial adults must be cnidarians"],"correct":0,"explanation":"Adult form alone can obscure ancestry. Echinoderm development and other evidence place them within Bilateria."},{"id":"c033","chapter":33,"kind":"concept","question":"A soft-bodied mollusc has a muscular foot, visceral mass, and mantle but no external shell. Is it necessarily excluded from Mollusca?","options":["No; shells can be reduced or lost","Yes; all molluscs require external shells","Yes; soft tissues cannot classify animals"],"correct":0,"explanation":"A group can retain its ancestry while losing a conspicuous feature. Multiple shared traits support classification."},{"id":"c034","chapter":34,"kind":"concept","question":"Why was the amniotic egg significant for terrestrial reproduction?","options":["It provides a protected fluid environment for the embryo","It eliminates all gas exchange","It makes every egg viviparous"],"correct":0,"explanation":"Extraembryonic membranes support embryonic development, exchange, and waste handling away from open water."},{"id":"c035","chapter":35,"kind":"concept","question":"Removing a ring of bark including phloem but leaving xylem initially intact most directly disrupts…","options":["Sugar transport across the ring","All upward water transport immediately","All leaf photosynthesis instantly"],"correct":0,"explanation":"Phloem occurs outside the vascular cambium. Roots may later decline when transport from photosynthetic sources is interrupted."},{"id":"c036","chapter":36,"kind":"concept","question":"A leaf has water potential −0.9 MPa and its stem −0.5 MPa. Water initially tends to move…","options":["From stem to leaf","From leaf to stem","Toward the numerically larger negative magnitude only if ATP is used"],"correct":0,"explanation":"Water moves from higher to lower water potential. −0.5 MPa is higher than −0.9 MPa."},{"id":"c037","chapter":37,"kind":"concept","question":"A plant grows poorly without phosphorus even when given extra nitrogen. Why might nitrogen fail to rescue it?","options":["The missing essential nutrient remains limiting","All minerals perform identical functions","Nitrogen cannot enter living cells"],"correct":0,"explanation":"Essential elements have distinct roles. Supplying one cannot substitute for another's chemical functions."},{"id":"c038","chapter":38,"kind":"concept","question":"In a typical angiosperm, one sperm fuses with the egg and one with two polar nuclei. Resulting ploidies?","options":["Diploid embryo and triploid endosperm","Triploid embryo and diploid endosperm","Two haploid embryos"],"correct":0,"explanation":"One plus one haploid set makes the zygote; one plus two sets makes the nutritive endosperm."},{"id":"c039","chapter":39,"kind":"concept","question":"Light from one side causes a young shoot to bend toward it. Which growth pattern explains the bend?","options":["Greater elongation on the shaded side","Greater elongation on the illuminated side","Equal elongation on every side"],"correct":0,"explanation":"Asymmetric auxin signaling promotes unequal elongation in the shoot. The longer shaded side bends it toward the light."},{"id":"c040","chapter":40,"kind":"concept","question":"Core temperature rises and sweating increases; cooling then reduces sweating. This is…","options":["Negative feedback","An irreversible positive loop","A mutation in each skin cell"],"correct":0,"explanation":"The response opposes the deviation from a regulated range and weakens as the deviation falls."},{"id":"c041","chapter":41,"kind":"concept","question":"A person cannot produce pancreatic lipase. Which process is directly impaired?","options":["Hydrolysis of dietary triglycerides","Bile synthesis by every hepatocyte","Peptide synthesis on ribosomes"],"correct":0,"explanation":"Lipase catalyzes fat digestion. Bile helps disperse fats but does not replace the missing catalytic reaction."},{"id":"c042","chapter":42,"kind":"concept","question":"During exercise, working muscle is warmer and more acidic. What happens to hemoglobin's oxygen affinity locally?","options":["It decreases, aiding unloading","It increases, trapping all oxygen","It disappears permanently"],"correct":0,"explanation":"Higher temperature and lower pH generally favor oxygen release where metabolism is active."},{"id":"c043","chapter":43,"kind":"concept","question":"A second exposure produces a faster, stronger response to the same antigen. Which explanation fits?","options":["Memory lymphocytes persist after the first response","All barriers become permanently impenetrable","Antibodies replicate their own DNA"],"correct":0,"explanation":"Clonal expansion and memory support faster secondary responses. Antibodies are proteins, not dividing cells."},{"id":"c044","chapter":44,"kind":"concept","question":"Dehydration increases ADH. What direct kidney change helps conserve water?","options":["More water-permeable collecting ducts","Complete stopping of filtration in every nephron","Loss of the medullary gradient"],"correct":0,"explanation":"ADH promotes aquaporin insertion. Water reabsorption depends on both permeability and an osmotic gradient."},{"id":"c045","chapter":45,"kind":"concept","question":"A target cell reduces receptor number during prolonged high hormone exposure. What may follow?","options":["Reduced sensitivity to that hormone","Guaranteed absence of every response","Conversion of the hormone into DNA"],"correct":0,"explanation":"Receptor downregulation can reduce responsiveness at a given hormone concentration."},{"id":"c046","chapter":46,"kind":"concept","question":"Negative feedback from testosterone reduces hypothalamic GnRH and pituitary LH. What can this do to testicular stimulation?","options":["Reduce LH-driven testosterone production","Force LH secretion to increase indefinitely","Convert sperm into endocrine neurons"],"correct":0,"explanation":"The axis regulates its output through feedback on upstream signals."},{"id":"c047","chapter":47,"kind":"concept","question":"Two cells share the same genome but occupy different embryonic positions and receive different signals. What can diverge first?","options":["Their gene-expression patterns","The number of elements in DNA","The meaning of every codon"],"correct":0,"explanation":"Cytoplasmic determinants and inductive signals can establish different regulatory states and cell fates."},{"id":"c048","chapter":48,"kind":"concept","question":"A stronger stimulus produces the same size action potentials but more per second. How is intensity encoded here?","options":["Firing frequency","Larger individual spikes","A changed genetic code"],"correct":0,"explanation":"Action potentials are approximately all-or-none. Frequency and population recruitment can encode stimulus intensity."},{"id":"c049","chapter":49,"kind":"concept","question":"Damage disconnects an intact sensory pathway from a cortical association area. Why might detection remain while interpretation changes?","options":["Sensation and integration involve distinct processing stages","Sensory receptors contain all conscious meanings","All brain functions occur in one interchangeable location"],"correct":0,"explanation":"Neural processing is distributed across specialized, connected circuits. Preserved input need not imply normal interpretation."},{"id":"c050","chapter":50,"kind":"concept","question":"Calcium stays low in a skeletal muscle fiber despite motor-neuron activity. What fails directly?","options":["Exposure of actin sites needed for cross-bridges","DNA copying in every myofibril","Shortening of individual actin molecules"],"correct":0,"explanation":"Calcium binds troponin, shifting tropomyosin. Without site exposure, normal cross-bridge cycling cannot proceed."},{"id":"c051","chapter":51,"kind":"concept","question":"A bird's song develops only with both species-typical predispositions and early exposure. Best interpretation?","options":["Genes and experience interact","Behavior is either entirely learned or entirely genetic","Learning requires changing every inherited allele"],"correct":0,"explanation":"Development of behavior can depend on inherited capacities interacting with experience during sensitive periods."},{"id":"c052","chapter":52,"kind":"concept","question":"A species tolerates a habitat in the lab but is absent there in nature. What remains a plausible explanation?","options":["Dispersal barriers or biotic interactions","Tolerance experiments prove it must occur there","Temperature is the only ecological variable"],"correct":0,"explanation":"Distribution reflects access, abiotic conditions, and interactions such as predation or competition."},{"id":"c053","chapter":53,"kind":"concept","question":"In logistic growth, a population reaches half its carrying capacity. At that point its total growth rate is…","options":["Maximal under the simple model","Zero by definition","Necessarily negative"],"correct":0,"explanation":"For dN/dt = rN(1−N/K), the product peaks at N = K/2. Per-capita and total growth rates differ."},{"id":"c054","chapter":54,"kind":"concept","question":"Removing a scarce predator radically changes community composition. Which role is supported?","options":["Keystone species","Dominant species solely because it is abundant","Primary producer"],"correct":0,"explanation":"A keystone species has an effect disproportionate to its abundance. Removal can release prey and cascade through the community."},{"id":"c055","chapter":55,"kind":"concept","question":"Producers fix 1,000 energy units and respire 400. What is net primary production?","options":["600 units","1,400 units","400 units"],"correct":0,"explanation":"NPP equals gross primary production minus producer respiration. It is energy available for growth and potential transfer to consumers."},{"id":"c056","chapter":56,"kind":"concept","question":"Two habitat patches are connected by a corridor. Which outcome is possible rather than guaranteed?","options":["More gene flow, alongside possible spread of disease or invaders","Automatic recovery of every species","Elimination of all edge effects"],"correct":0,"explanation":"Connectivity can benefit dispersal and genetic diversity, but design and ecological context determine tradeoffs."}],"bridges":[{"chapter":1,"prompt":"How would you redesign this study, and why would more plants in the same two plots not fully fix it?","rubric":["Vary fertilizer independently of light","Use independent replicated plots and random assignment","Distinguish more measurements from independent experimental units"]},{"chapter":2,"prompt":"Connect electron arrangement, chemical bonding, and the behavior of sodium in water without saying that atoms choose to bond.","rubric":["Valence electrons influence reactivity","Electron transfer can form ions","Water stabilizes separated ions through hydration"]},{"chapter":3,"prompt":"Connect hydrogen bonding to both floating ice and resistance to rapid temperature change.","rubric":["Hydrogen bonds organize ice into an open lattice","Changing temperature requires energy and rearranges interactions","These properties stabilize aquatic habitats"]},{"chapter":4,"prompt":"Why can matching a molecular formula be insufficient to predict biological activity? Connect isomerism to proteins.","rubric":["Connectivity or spatial arrangement can differ","Protein binding depends on shape and chemical interactions","Different isomers can produce different responses"]},{"chapter":5,"prompt":"Connect amino acid sequence, noncovalent interactions, protein shape, and the effects of temperature.","rubric":["Sequence influences folding possibilities","Interactions stabilize higher-order structure","Temperature can disrupt shape and therefore function"]},{"chapter":6,"prompt":"Trace a secreted protein from gene to extracellular destination, naming where information becomes material.","rubric":["Nuclear transcription produces an RNA message","ER-associated ribosomes translate it and ER processes the protein","Vesicles carry it through Golgi to exocytosis"]},{"chapter":7,"prompt":"Connect osmosis, cell walls, and why a plant cell can become turgid without bursting.","rubric":["Solute differences drive net water entry","The wall limits expansion","Pressure potential rises until the water-potential difference is balanced"]},{"chapter":8,"prompt":"Explain how ATP coupling can drive an unfavorable process while an enzyme alone cannot change its thermodynamic favorability.","rubric":["Enzymes lower activation energy","Coupling combines reactions through a shared mechanism","The summed free-energy change can be negative"]},{"chapter":9,"prompt":"Connect oxidation of food, electron transport, chemiosmosis, and the need for an intact membrane.","rubric":["Fuel oxidation supplies high-energy electrons","Electron transport builds a proton gradient","ATP synthase uses gradient energy across a selectively permeable membrane"]},{"chapter":10,"prompt":"Compare how C₄ and CAM plants separate initial carbon capture from the Calvin cycle, and connect both to water conservation.","rubric":["C₄ plants primarily separate steps between cell types","CAM plants primarily separate steps in time","Both concentrate CO₂ around rubisco under water-limiting conditions"]},{"chapter":11,"prompt":"Connect a surface receptor, a second messenger, and gene regulation; explain where amplification can occur.","rubric":["A receptor converts extracellular binding into intracellular activity","A relay can activate or produce many downstream molecules","Activated regulators can alter transcription"]},{"chapter":12,"prompt":"Connect checkpoint failure, chromosome imbalance, and cancer risk without claiming every abnormal cell becomes cancerous.","rubric":["Checkpoints limit propagation of errors","Missegregation can change gene dosage","Additional changes and failed controls may permit uncontrolled growth"]},{"chapter":13,"prompt":"Explain how crossing over and independent assortment contribute different kinds of variation in gametes.","rubric":["Crossing over exchanges segments between homologs","Independent assortment mixes maternal and paternal homologs across pairs","Both act before fertilization adds further combinations"]},{"chapter":14,"prompt":"Connect segregation to the 1:2:1 genotype ratio and explain why a small family need not show exact expected proportions.","rubric":["Each heterozygous parent contributes either allele","Random fertilization gives AA:Aa:aa probabilities of 1:2:1","Probability predicts long-run frequencies rather than quotas within one family"]},{"chapter":15,"prompt":"Why can two loci on the same chromosome appear to assort independently when far apart?","rubric":["Crossovers separate linked alleles","Multiple crossovers can restore parental arrangements","Observed recombination approaches 50% and can underestimate long distances"]},{"chapter":16,"prompt":"Connect polarity, RNA primers, Okazaki fragments, and DNA ligase.","rubric":["Primase provides extendable 3′ ends","Lagging-strand synthesis repeatedly initiates fragments","Primer replacement and ligase create a continuous DNA strand"]},{"chapter":17,"prompt":"Connect DNA mutation, RNA processing, and protein function; explain why not every mutation changes an amino acid.","rubric":["Effects depend on location and sequence","Splicing and codon redundancy can alter or buffer consequences","Protein effects depend on the resulting sequence and structure"]},{"chapter":18,"prompt":"Connect chromatin accessibility, transcription factors, and cell differentiation.","rubric":["Accessible regulatory DNA permits factor binding","Combinations of factors regulate particular genes","Maintained expression patterns support specialized cell functions"]},{"chapter":19,"prompt":"Compare a lytic infection and a latent integrated viral genome, connecting gene expression to timing of host-cell damage.","rubric":["Lytic replication makes viral components and often destroys the host","Integrated genomes can persist with limited expression","A switch in gene activity can reactivate productive infection"]},{"chapter":20,"prompt":"Connect complementary base pairing to PCR, DNA probes, and CRISPR guide targeting.","rubric":["PCR primers recognize complementary target sequences","Probes bind matching nucleic acids","Guide RNA helps direct a nuclease to complementary DNA subject to additional targeting requirements"]},{"chapter":21,"prompt":"Explain how gene duplication can enable new functions without immediately eliminating an essential old function.","rubric":["An extra copy preserves some functional redundancy","Copies can accumulate different changes","Selection may retain useful specialization while other copies become inactive"]},{"chapter":22,"prompt":"Distinguish individual acclimation from evolution of a population, using pesticide exposure as context.","rubric":["Individuals may change physiology during life","Evolution concerns inherited changes across generations","Evidence of allele-frequency change supports a population-level explanation"]},{"chapter":23,"prompt":"Compare drift, selection, and gene flow in their effects on variation within and between populations.","rubric":["Drift can randomly lose alleles, especially in small populations","Selection favors variants in a particular environment","Gene flow can introduce variation and reduce differences between populations"]},{"chapter":24,"prompt":"Connect reduced gene flow, divergent selection, and reinforcement; state when reinforcement is expected.","rubric":["Reduced gene flow allows divergence","Hybrids with lower fitness can create selection against interbreeding","Reinforcement strengthens prezygotic barriers under those conditions"]},{"chapter":25,"prompt":"Connect mass extinction, adaptive radiation, and why evolution has no predetermined goal.","rubric":["Extinction changes available niches and interactions","Surviving variants face new selection pressures","Diversification is contingent on history and conditions, not a planned endpoint"]},{"chapter":26,"prompt":"Explain why similarity alone can mislead phylogeny; connect homology, convergence, and molecular evidence.","rubric":["Homology reflects shared ancestry","Convergence produces similarity independently","Multiple character and sequence comparisons help infer ancestry"]},{"chapter":27,"prompt":"Connect mutation, horizontal gene transfer, and antibiotic selection in the spread of resistance.","rubric":["Mutation or imported DNA can supply resistance variants","Transfer distributes variants across lineages","Antibiotics favor reproduction of resistant cells under exposure"]},{"chapter":28,"prompt":"Compare primary and secondary endosymbiosis and connect membrane number to historical evidence.","rubric":["Primary plastids derive from a cyanobacterial partner","Secondary events incorporate an already photosynthetic eukaryote","Membranes and remnant genes can preserve clues to the event"]},{"chapter":29,"prompt":"Connect protected embryos, resistant spores, and water-dependent sperm to the transition onto land.","rubric":["Retained embryos gain parental protection","Spore walls resist drying during dispersal","Motile sperm preserve a dependence on water for fertilization"]},{"chapter":30,"prompt":"Connect pollen, fertilization, seeds, and fruit to distinct stages of reproduction and dispersal.","rubric":["Pollen transports the male gametophyte","Fertilization initiates an embryo within the developing seed","Fruit can protect or disperse angiosperm seeds"]},{"chapter":31,"prompt":"Connect fungal hyphae, external digestion, and ecosystem nutrient recycling.","rubric":["Hyphal surface area supports secretion and absorption","Enzymes depolymerize organic material","Decomposition returns nutrients to forms other organisms can use"]},{"chapter":32,"prompt":"Connect body symmetry, cephalization, and movement without treating evolution as a ladder.","rubric":["Directional movement can favor concentration of sensory structures anteriorly","Bilateral organization is associated with many such lineages","Different ecological histories can alter adult form without changing ancestry"]},{"chapter":33,"prompt":"Compare an arthropod exoskeleton with a molluscan mantle-secreted shell in growth and protection.","rubric":["Both can protect soft tissues","Arthropod growth requires molting a rigid exoskeleton","Many molluscan shells enlarge by secretion at growth regions"]},{"chapter":34,"prompt":"Connect the amniotic egg and mammalian pregnancy as modifications of shared developmental structures.","rubric":["Amniotic membranes protect and support embryos","Placental mammals retain modified extraembryonic membranes","Live birth modifies reproductive support rather than erasing amniote ancestry"]},{"chapter":35,"prompt":"Connect primary growth, secondary growth, and the positions of xylem and phloem in a woody stem.","rubric":["Apical meristems extend the plant","Vascular cambium adds secondary xylem inward and phloem outward","Transport tissues occupy different positions and functions"]},{"chapter":36,"prompt":"Connect transpiration, cohesion, tension, and why a continuous xylem water column matters.","rubric":["Evaporation lowers leaf water potential","Cohesion transmits tension through connected water","Breaks in the column reduce effective transport"]},{"chapter":37,"prompt":"Connect soil microbes, nitrogen availability, and the carbon cost of a root symbiosis.","rubric":["Microbial partners can supply usable nitrogen","The plant supplies organic carbon from photosynthesis","The relationship involves exchange and depends on resource conditions"]},{"chapter":38,"prompt":"Connect double fertilization to allocation of resources into seeds and distinguish embryo from endosperm.","rubric":["Two fusion events initiate embryo and nutritive tissue","Endosperm supports embryo development","The two products have different developmental roles and usually different ploidies"]},{"chapter":39,"prompt":"Connect directional light sensing, hormone redistribution, and cell-wall expansion.","rubric":["Photoreceptors detect directional illumination","Auxin distribution or response becomes asymmetric","Differential wall expansion produces curvature"]},{"chapter":40,"prompt":"Connect receptors, integrating centers, effectors, and why negative feedback does not mean an undesirable effect.","rubric":["Sensors detect a regulated variable","An integrating system coordinates effector activity","Negative describes opposition to the initial change"]},{"chapter":41,"prompt":"Connect emulsification, enzymatic hydrolysis, and absorption of dietary lipids.","rubric":["Bile disperses lipids and increases accessible surface","Lipases break ester bonds","Digestion products enter absorptive cells and are processed for transport"]},{"chapter":42,"prompt":"Connect ventilation, circulation, hemoglobin binding, and the oxygen demand of cellular respiration.","rubric":["Ventilation maintains lung gas gradients","Circulation transports oxygen bound mainly to hemoglobin","Tissue conditions and consumption favor delivery to respiring cells"]},{"chapter":43,"prompt":"Connect antigen specificity, clonal selection, and why memory to one pathogen does not guarantee immunity to every pathogen.","rubric":["Receptors differ among lymphocyte clones","Antigen selects and expands matching clones","Memory retains specificity, so unrelated antigens may require a new response"]},{"chapter":44,"prompt":"Connect the nephron's salt gradient, collecting-duct permeability, and urine concentration.","rubric":["Transport and countercurrent organization establish a medullary gradient","ADH changes water permeability","Water moves osmotically, leaving more concentrated urine when conditions permit"]},{"chapter":45,"prompt":"Connect endocrine negative feedback with receptor-level sensitivity; explain why hormone concentration alone may not predict effect.","rubric":["Feedback regulates secretion","Receptor abundance and signaling affect tissue response","The same concentration can have different effects in different physiological states"]},{"chapter":46,"prompt":"Connect hypothalamus, anterior pituitary, and gonads; distinguish a signal pathway from the developmental sequence of gametes.","rubric":["GnRH regulates pituitary gonadotropin release","LH and FSH affect gonadal functions","Gametogenesis is a cellular process controlled by, but distinct from, endocrine signaling"]},{"chapter":47,"prompt":"Connect positional information, induction, and differential gene expression to formation of tissues.","rubric":["Cells obtain spatial cues through local signals or inherited determinants","Regulators activate different gene networks","Different protein outputs produce distinct cell behaviors and tissues"]},{"chapter":48,"prompt":"Connect graded potentials, threshold, and all-or-none spikes; explain how a continuous stimulus can become a spike train.","rubric":["Inputs generate graded membrane changes","Threshold triggers regenerative action potentials","Repeated threshold crossings generate a frequency-coded output"]},{"chapter":49,"prompt":"Connect sensory input, integration, and motor output in a reflex versus a deliberate response.","rubric":["Receptors provide input","Spinal or brain circuits integrate that input at different levels","Motor pathways execute responses, with conscious processing not required for every reflex"]},{"chapter":50,"prompt":"Connect a motor-neuron signal, calcium release, ATP use, and sliding filaments.","rubric":["Neuromuscular signaling triggers muscle excitation and calcium release","Calcium permits actin-myosin interaction","ATP supports cross-bridge cycling as filaments slide rather than shrink"]},{"chapter":51,"prompt":"Give a proximate and an ultimate explanation for migration, keeping mechanism distinct from evolutionary function.","rubric":["Proximate explanations address cues and physiological mechanisms","Ultimate explanations address effects on reproductive success and history","Both can describe the same behavior without replacing one another"]},{"chapter":52,"prompt":"Connect physiological tolerance, dispersal, and species interactions to observed geographic range.","rubric":["Abiotic conditions set some constraints","Organisms must reach and establish in a site","Biotic interactions can further restrict or facilitate occupancy"]},{"chapter":53,"prompt":"Connect exponential growth, density dependence, and why carrying capacity can change.","rubric":["Exponential growth assumes constant per-capita increase","Resource limitation can make growth density dependent","Environmental changes alter resource supply and therefore K"]},{"chapter":54,"prompt":"Connect predation, competition, and a trophic cascade following predator removal.","rubric":["Predators constrain prey populations or behavior","Released prey can alter competitors or producers","Indirect effects can propagate across multiple feeding levels"]},{"chapter":55,"prompt":"Why does energy flow through an ecosystem while nutrients cycle? Connect respiration and decomposition.","rubric":["Energy enters, transforms, and ultimately dissipates as heat","Atoms are conserved and can be reused","Decomposers return nutrients while also respiring organic material"]},{"chapter":56,"prompt":"Connect small-population drift, inbreeding, habitat connectivity, and conservation decisions.","rubric":["Small isolated populations can lose variation and accumulate inbreeding","Movement can introduce alleles and rescue populations","Management weighs those benefits against ecological risks and local adaptation"]}]};
</script><script>
'use strict';
const DATA=window.GEN_BIO_DATA,G=DATA.glossary,C=DATA.chapters,Q=DATA.questions,B=DATA.bridges;
const UNITS=['A way of seeing','The chemistry of life','The cell','Genetics','Evolution','Life’s diversity','Plants','Animals','Ecology'];
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s)), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=n=>`<svg class="icon" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const norm=s=>String(s).normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[’′']/g,'').replace(/[^a-z0-9αβψ]+/g,' ').trim();
const shuffled=a=>{let r=[...a];for(let i=r.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]]}return r};
const fresh=()=>({version:1,chapter:null,terms:{},answers:{},attempts:[],bridges:{},bookmarks:[],edits:{},notes:{},links:[],sessions:0});

S.chapter=null; // A fresh visit always starts with an explicit chapter choice.
