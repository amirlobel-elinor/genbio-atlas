function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').style.display='none',4000)}
const chapter=()=>C.find(c=>c.id===Number(S.chapter))||null;
const getTerm=id=>G.find(g=>g.id===id);
const termData=g=>S.edits[g.id]?{...g,...S.edits[g.id]}:g;
const chapterTerms=(n=S.chapter)=>G.filter(g=>termData(g).chapters.includes(Number(n)));
const established=g=>(S.terms[g.id]?.level||0)>=2;
const due=g=>S.terms[g.id]&&S.terms[g.id].due<=Date.now();
const touched=g=>!!S.terms[g.id];
const sourceHTML=q=>q.kind==='public'?`<div class="source">Adapted from <a href="${q.url}" target="_blank" rel="noopener">OpenStax Biology 2e · Chapter ${q.os}, review question ${q.sourceQuestion}</a>. Wording, choices, and explanation modified. Mary Ann Clark, Matthew Douglas, and Jung Choi · © 2018 OpenStax / Rice University · <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/" target="_blank" rel="noopener">CC BY-NC-SA 4.0</a>. <a href="https://openstax.org/books/biology-2e/pages/1-introduction" target="_blank" rel="noopener">Access for free at https://openstax.org/books/biology-2e/pages/1-introduction</a>.</div>`:`<div class="source">Original Gen Bio Atlas application problem · Campbell topic alignment; not a publisher test-bank item.</div>`;
const progressBar=(a,b)=>`<div class="progress"><i style="width:${b?Math.min(100,100*a/b):0}%"></i></div>`;
function art(){return `<svg viewBox="0 0 420 260" aria-label="Botanical illustration with connected cellular forms" role="img"><g stroke="#7fa18a" stroke-width=".8" fill="none" opacity=".6"><circle cx="237" cy="127" r="106"/><circle cx="237" cy="127" r="83" stroke-dasharray="3 7"/><path d="M62 191 157 151m162-97 48-24M259 196l62 40"/><circle cx="63" cy="191" r="29"/><circle cx="351" cy="46" r="16"/></g><g transform="translate(165 16)"><path d="M53 213c16-61 10-118 7-175" stroke="#b8cd91" stroke-width="3" fill="none"/><path d="M61 111C5 115-1 64 5 37c50 6 65 43 56 74Z" fill="#9bba76"/><path d="M62 84c-3-42 27-65 69-66 4 43-33 70-69 66Z" fill="#d9e8a8"/><path d="M63 166C20 168 2 138 0 111c43-3 65 22 63 55Z" fill="#73986e"/><path d="M65 142c1-32 27-56 65-47-2 35-27 52-65 47Z" fill="#b5cd91"/><path d="m14 51 48 57m56-76L64 80m-49 44 47 38m52-53-49 29" stroke="#173e34" stroke-width="1" opacity=".55"/><path d="M36 215h41" stroke="#b7c597"/></g><g stroke="#b8cb94" fill="none"><ellipse cx="63" cy="191" rx="19" ry="10" transform="rotate(-28 63 191)"/><circle cx="64" cy="191" r="4"/><path d="M49 181c15-8 28 0 31 9"/></g><text x="18" y="243" class="specimen-label">STRUCTURE ↔ FUNCTION</text><text x="284" y="250" class="specimen-label">GROW CONNECTIONS</text><g fill="#d8ac79"><circle cx="142" cy="52" r="3"/><circle cx="339" cy="167" r="4"/><circle cx="113" cy="124" r="2"/></g></svg>`}
function setChapter(n){const id=Number(n);S.chapter=C.some(c=>c.id===id)?id:null;save();$('#chapterSelect').value=S.chapter||''}
$('#chapterSelect').innerHTML='<option value="">Choose a chapter</option>'+C.map(c=>`<option value="${c.id}">${String(c.id).padStart(2,'0')} · ${esc(c.title)}</option>`).join('');$('#chapterSelect').value=S.chapter||'';
function nav(p){clearInterval(testTimer);session=null;page=p==='chapters'?'home':p;if(['chapter','study'].includes(page)&&!chapter())page='home';render();window.scrollTo({top:0,behavior:'instant'})}
function render(){ $('#chapterSelect').hidden=page==='home'||page==='chapters';$$('.nav [data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===(['chapter','study','chapters'].includes(page)?'home':page==='review'?'settings':page)));const views={home:homeView,chapters:chaptersView,chapter:chapterView,study:studyView,review:reviewView,sources:sourcesView,settings:settingsView};$('#content').innerHTML=(views[page]||homeView)(); }
function footer(){return `<p class="footer">Independent study companion · Gen Bio Atlas explanations, not the publisher’s glossary wording. Progress is saved in this browser. Back it up from Notebook.</p>`}
function modeCard(mode,name,desc,ic){return `<button class="mode-card" data-mode="${mode}"><span class="badge-icon">${icon(ic)}</span><h3>${name}<span class="arrow">↗</span></h3><p>${desc}</p></button>`}
function homeView(){return chaptersView()}
function chapterTile(c){let v=chapterTerms(c.id);return `<button class="chapter-card" data-chapter="${c.id}"><div class="row between"><span class="chapter-number">${String(c.id).padStart(2,'0')}</span><span class="small">${v.length} terms</span></div><h3>${esc(c.title)}</h3><span class="small">Choose chapter →</span></button>`}
function chaptersView(){let filtered=C.filter(c=>(unitFilter<0||c.unit===unitFilter)&&norm(`${c.id} ${c.title} ${c.goal}`).includes(norm(chapterQuery)));return `<div class="page-head"><div><div class="eyebrow muted">FROM MOLECULES TO ECOSYSTEMS</div><h1 style="margin-top:10px">Choose a chapter</h1><p class="muted">Start where your course is. Choose a chapter, then an activity.</p></div></div><input class="field" id="chapterSearch" value="${esc(chapterQuery)}" placeholder="Find a chapter or topic…" aria-label="Search chapters"><details class="unit-filter"><summary>Filter by unit</summary><div class="filters"><button class="chip ${unitFilter<0?'active':''}" data-unit="-1">All chapters</button>${UNITS.map((u,i)=>`<button class="chip ${i===unitFilter?'active':''}" data-unit="${i}">${u}</button>`).join('')}</div></details><div id="chapterResults">${chapterResults(filtered)}</div>${footer()}`}
function chapterResults(list){return list.length?UNITS.map((u,i)=>{let cs=list.filter(c=>c.unit===i);return cs.length?`<h2 class="unit-heading">${u}</h2><div class="chapter-grid">${cs.map(chapterTile).join('')}</div>`:''}).join(''):`<div class="empty">No chapters match. Try a broader topic.</div>`}
function chapterView(){let c=chapter(),v=chapterTerms(),caseq=Q.find(q=>q.chapter===c.id&&q.kind==='concept');return `<div class="row between" style="margin-bottom:16px"><button class="small" data-nav="chapters">← All chapters</button><span class="pill">${UNITS[c.unit]}</span></div><section class="chapter-hero"><div class="eyebrow">CHAPTER ${String(c.id).padStart(2,'0')}</div><h1>${esc(c.title)}</h1><p>${esc(c.goal)}</p><div class="row"><span class="pill green">${v.length} study terms</span><span class="pill">2 sourced practice questions</span><span class="pill">1 application case + 1 connection</span></div></section><div class="mode-grid">${modeCard('cards','Flashcards','Retrieve → reveal → schedule a review','cards')}${modeCard('match','Match the meaning','A calm four-pair vocabulary game','leaf')}${modeCard('recall','Name that concept','Type the term before seeing the answer','spark')}${modeCard('concept','Concept lab','Predict and explain a biological outcome','link')}${modeCard('bridge','Connect the ideas','Write an explanation, then check a rubric','link')}${modeCard('test','Practice test','Submit first, then review answers & sources','test')}</div><div class="split" style="margin-top:25px"><section class="panel"><div class="row between"><h2>Your chapter vocabulary</h2><button class="small" data-action="chapterGloss">Browse all →</button></div><p class="small">Suggested topic links for this chapter</p><div class="term-cloud">${v.slice(0,16).map(g=>`<button class="term-chip" data-term="${g.id}">${esc(termData(g).term)}</button>`).join('')}</div></section><section class="panel"><div class="eyebrow muted">Go deeper</div><h2 style="margin-top:10px">Read. Watch. Question.</h2><p class="small">Use the source chapter and video collections to revisit an explanation, then return for active practice.</p><button class="btn secondary small-btn" data-nav="sources" style="margin-top:18px">Chapter resources ↗</button><p class="small" style="margin-top:18px">The concept lab contains a curated application case, not an exhaustive chapter exam. Mix chapters for a longer test.</p></section></div>${footer()}`}
function vocabPool(scope){let p=scope==='all'?G:scope==='due'?G.filter(due):scope==='saved'?G.filter(g=>S.bookmarks.includes(g.id)):chapterTerms();return p.filter(g=>!g.review)}
function makeVocab(mode,scope='chapter'){let p=vocabPool(scope);p=shuffled(p).sort((a,b)=>(due(b)?2:!touched(b)?1:0)-(due(a)?2:!touched(a)?1:0));session={mode,scope,pool:p,index:0,revealed:false,graded:false,result:null,correct:0,rounds:0,matched:[],left:null,right:null};if(mode==='match')newMatch();}
function startMode(mode,scope='chapter'){if(!chapter()&&scope==='chapter'){nav('home');toast('Choose a chapter to start studying.');return}clearInterval(testTimer);page='study';if(['cards','match','recall'].includes(mode))makeVocab(mode,scope);else if(mode==='concept'){session={mode,pool:Q.filter(q=>q.kind==='concept'&&q.chapter===S.chapter).map(shuffleQ),index:0,selected:null,graded:false,correct:0}}else if(mode==='bridge'){session={mode,revealed:false};}else if(mode==='test'){session={mode,phase:'setup'}}render();window.scrollTo({top:0,behavior:'instant'})}
function shuffleQ(q){let options=shuffled(q.options.map((text,i)=>({text,original:i})));return {...q,choices:options}}
function resolvedDefinition(g){let e=termData(g);if(e.aliasOf){let target=G.find(x=>norm(x.term)===norm(e.aliasOf));if(target)return termData(target).definition}return e.definition}
function sessionHeader(title,sub){return `<div class="session-top"><div class="row between"><button class="small" data-nav="${chapter()?'chapter':'home'}">← ${chapter()?'Chapter '+S.chapter:'Choose a chapter'}</button><span class="pill">${esc(sub)}</span></div><h1 style="margin-top:18px;font-size:35px">${title}</h1></div>`}
function studyView(){if(!session)return chapterView();let m=session.mode;return `<div class="session">${m==='test'?testView():m==='bridge'?bridgeView():m==='concept'?conceptView():m==='match'?matchView():vocabView()}</div>`}
function scopeControls(){return `<div class="filters" aria-label="Term set">${[['chapter','This chapter'],['due','Due across all chapters'],['all','All glossary terms'],['saved','Saved terms']].map(([v,t])=>`<button class="chip ${session.scope===v?'active':''}" data-scope="${v}">${t}</button>`).join('')}</div>`}
function vocabView(){let {mode,pool,index,revealed,graded,result}=session;let title=mode==='cards'?'Recall & grow':'Name that concept';let header=sessionHeader(title,mode==='cards'?'Spaced vocabulary practice':'Written term recall')+scopeControls();if(!pool.length)return header+`<div class="panel empty">No terms in this set right now. Try this chapter or all glossary terms.</div>`;if(index>=pool.length)return header+`<div class="panel empty"><h2>You reached the end of this set.</h2><p>Return later for spaced retrieval, or explore a different chapter.</p><button class="btn" data-nav="review" style="margin-top:20px">View review</button></div>`;let g=pool[index],e=termData(g);return header+`<div class="row between" style="margin-bottom:12px"><span class="session-count">${index+1} / ${pool.length} · ${session.rounds} reviewed this session</span><button class="small" data-term="${g.id}">Glossary ↗</button></div><div class="study-card"><span class="eyebrow muted">${mode==='cards'?'EXPLAIN THIS TERM BEFORE REVEALING':'WHICH TERM MATCHES THIS DEFINITION?'}</span>${mode==='cards'?`<h2>${esc(e.term)}</h2>${revealed?`<p class="definition">${esc(resolvedDefinition(g))}</p><span class="small">Gen Bio Atlas explanation · rate your unaided recall honestly.</span>`:`<p class="muted" style="font-size:13px">Say it in your own words. Can you give an example?</p><div class="study-controls"><button class="btn" data-action="reveal">Reveal definition</button></div>`}`:`<p class="definition">${esc(resolvedDefinition(g))}</p>${graded?`<div class="feedback ${result?'':'wrong'}"><strong>${result?'You recalled it.':'The glossary term is…'}</strong><div class="term-answer">${esc(e.term)}</div>${!result?'A synonym may still be valid. Compare your meaning before choosing below.':''}</div>`:`<form id="recallForm"><input class="field" id="recallAnswer" autocomplete="off" placeholder="Type the term…" aria-label="Your term"><div class="study-controls"><button class="btn" type="submit">Check answer</button><button class="btn secondary" type="button" data-action="giveUp">Show answer</button></div></form>`}`}</div>${mode==='cards'&&revealed?`<div class="study-controls"><button class="btn secondary" data-rate="again">Study again · 10 min</button><button class="btn soft" data-rate="good">Recalled · spaced review</button><button class="btn" data-rate="easy">Effortless · longer interval</button></div>`:mode==='recall'&&graded?`<div class="study-controls">${!result?`<button class="btn secondary" data-rate="again">Review this term again</button><button class="btn soft" data-rate="good">My synonym was correct</button>`:`<button class="btn" data-rate="good">Continue →</button>`}</div>`:''}`}
function rateTerm(r){let g=session.pool[session.index];if(!g)return;let old=S.terms[g.id]||{level:0,seen:0,lastSuccess:0};let now=Date.now(),level=old.level||0;if(r==='again')level=0;else if(!old.lastSuccess||now-old.lastSuccess>20*3600000)level=Math.min(4,level+1);let days=r==='easy'?[0,4,7,14,30][Math.max(1,level)]:[0,1,3,7,14][Math.max(1,level)];S.terms[g.id]={level,seen:(old.seen||0)+1,due:now+(r==='again'?600000:days*86400000),last:now,lastSuccess:r==='again'?old.lastSuccess:now,lastRating:r};S.sessions++;save();session.index++;session.rounds++;session.revealed=false;session.graded=false;session.result=null;render()}
function checkRecall(value){let g=session.pool[session.index],e=termData(g),variants=[e.term,e.term.replace(/\s*\([^)]*\)/g,'')];let abbreviation=e.term.match(/\(([^)]+)\)/);if(abbreviation&&/[A-Z]/.test(abbreviation[1]))variants.push(abbreviation[1]);if(e.aliasOf)variants.push(e.aliasOf);let result=variants.some(x=>norm(x)===norm(value))&&norm(value).length>0;session.graded=true;session.result=result;render()}
function newMatch(){let seen=new Set();let p=shuffled(session.pool).filter(g=>{let d=resolvedDefinition(g);if(seen.has(d))return false;seen.add(d);return true});session.pairs=p.slice(0,4);session.rightOrder=shuffled(session.pairs);session.left=null;session.right=null;session.matched=[];session.message='Choose one term and its matching definition.';session.errors=0}
function matchView(){let s=session;return sessionHeader('Match the meaning','Vocabulary connections')+scopeControls()+(s.pairs.length<4?`<div class="panel empty">This set needs at least four distinct definitions. Choose another set.</div>`:`<div class="row between"><span class="small">${s.matched.length}/4 pairs · ${s.errors} ${s.errors===1?'retry':'retries'}</span><span class="small">${s.rounds} rounds completed</span></div><div class="match-grid"><div class="match-column">${s.pairs.map(g=>`<button class="match-tile term ${s.left===g.id?'selected':''} ${s.matched.includes(g.id)?'matched':''}" data-match-left="${g.id}" ${s.matched.includes(g.id)?'disabled':''}>${esc(termData(g).term)}</button>`).join('')}</div><div class="match-column">${s.rightOrder.map(g=>`<button class="match-tile ${s.right===g.id?'selected':''} ${s.matched.includes(g.id)?'matched':''}" data-match-right="${g.id}" ${s.matched.includes(g.id)?'disabled':''}>${esc(resolvedDefinition(g))}</button>`).join('')}</div></div><div class="notice" role="status">${esc(s.message)}</div>${s.matched.length===4?`<div class="study-controls"><button class="btn" data-action="newMatch">Another round →</button><button class="btn secondary" data-mode="recall">Try written recall</button></div>`:''}<p class="small" style="margin-top:16px">Matching gives useful recognition practice. Use flashcards or written recall to build your spaced-review record.</p>`)}
function chooseMatch(side,id){let s=session;if(s.matched.includes(id))return;s[side]=id;if(s.left&&s.right){if(s.left===s.right){s.matched.push(id);s.message=s.matched.length===4?'All four connections found. Now try recalling without choices.':'That pair belongs together.';if(s.matched.length===4){s.rounds++;S.sessions++;save()}}else{s.errors++;s.message='Those do not match. Re-read the defining feature and try again.'}s.left=null;s.right=null}render()}
function questionOptions(q,selected,graded,action='answer'){return `<div class="options">${q.choices.map((o,i)=>`<button class="option ${selected===i?'selected':''} ${graded&&o.original===q.correct?'correct':''} ${graded&&selected===i&&o.original!==q.correct?'wrong':''}" data-${action}="${i}" ${graded?'disabled':''}><span>${String.fromCharCode(65+i)}</span>${esc(o.text)}</button>`).join('')}</div>`}
function recordAnswer(q,correct,choice){let previous=S.answers[q.id];S.answers[q.id]={correct,attempts:(previous?.attempts||0)+1,choice,at:Date.now()};save()}
function conceptView(){let s=session;if(s.index>=s.pool.length)return sessionHeader('Keep connecting','Concept lab complete')+`<div class="panel"><div class="score-ring">${s.correct}/${s.pool.length}</div><h2 style="text-align:center">A mechanism is more than a term.</h2><p class="muted" style="text-align:center">Now explain the connection without answer choices.</p><div class="study-controls"><button class="btn" data-mode="bridge">Build a connection →</button><button class="btn secondary" data-nav="chapter">Back to chapter</button></div></div>`;let q=s.pool[s.index],right=s.graded&&q.choices[s.selected].original===q.correct;return sessionHeader('Think it through','Original application case')+`<section class="panel"><div class="row between"><span class="eyebrow muted">PREDICT • EXPLAIN • CONNECT</span><span class="small">${s.index+1}/${s.pool.length}</span></div><h2 class="question">${esc(q.question)}</h2>${questionOptions(q,s.selected,s.graded)}${!s.graded&&q.kind==='public'?sourceHTML(q):''}${s.graded?`<div class="feedback ${right?'':'wrong'}"><strong>${right?'Correct — here is the mechanism.':'Revisit the mechanism.'}</strong>${esc(q.explanation)}</div>${sourceHTML(q)}<div class="study-controls"><button class="btn" data-action="nextConcept">Continue →</button></div>`:`<p class="small" style="margin-top:18px">Choose an answer to check your reasoning.</p>`}</section>`}
function bridgeView(){let c=chapter(),b=B.find(x=>x.chapter===c.id),saved=S.bridges[c.id]||{text:'',checks:[]};return sessionHeader('Connect the ideas','Written synthesis · self-assessed')+`<section class="panel"><span class="eyebrow muted">BUILD AN EXPLANATION</span><h2 class="question">${esc(b.prompt)}</h2><label class="field-label" for="bridgeAnswer">Your explanation</label><textarea id="bridgeAnswer" class="field" placeholder="Start with a cause. Follow it to a mechanism and an outcome…">${esc(saved.text)}</textarea><p class="small">Your draft saves as you type. Write an attempt before opening the guide.</p>${session.revealed?`<div class="feedback"><strong>Compare the links in your explanation</strong>These are checkpoints, not an automatic grade. Select each idea your answer explains accurately.</div><div class="rubric">${b.rubric.map((r,i)=>`<label><input type="checkbox" data-rubric="${i}" ${saved.checks.includes(i)?'checked':''}><span>${esc(r)}</span></label>`).join('')}</div><p class="small">${saved.checks.length}/3 connections self-checked. Revise your explanation where a link is missing.</p><div class="study-controls"><button class="btn" data-nav="chapter">Return to chapter</button></div>`:`<div class="study-controls"><button class="btn" data-action="revealBridge">Compare with explanation guide</button></div>`}<div class="source">Original synthesis prompt · built around the chapter's learning goal.</div></section>`}
function testView(){let s=session;if(s.phase==='setup')return sessionHeader('Practice with purpose','Public questions + optional application cases')+`<section class="panel"><h2>Build your practice test</h2><p class="muted" style="font-size:13px">Public questions are adapted from OpenStax Biology 2e. This is a starter bank: two sourced questions per Campbell chapter. Mix chapters for a longer test.</p><div style="margin-top:22px"><label class="field-label" for="testScope">Chapters</label><select id="testScope" class="field"><option value="chapter">Chapter ${S.chapter} · ${esc(chapter().title)}</option><option value="unit">This unit · ${UNITS[chapter().unit]}</option><option value="all">All 56 chapters</option></select></div><div style="margin-top:18px"><label class="field-label" for="testKind">Question bank</label><select id="testKind" class="field"><option value="public">Public-source practice only</option><option value="mixed">Public-source + original concept cases</option><option value="missed">Previously missed questions in this scope</option></select></div><div class="row" style="margin-top:18px"><div style="flex:1"><label class="field-label" for="testLength">Maximum questions</label><select id="testLength" class="field"><option>10</option><option>20</option><option>40</option><option value="999">All available</option></select></div><div style="flex:1"><label class="field-label" for="testMinutes">Timer</label><select id="testMinutes" class="field"><option value="0">Untimed</option><option value="5">5 minutes</option><option value="15">15 minutes</option><option value="30">30 minutes</option></select></div></div><div class="notice" style="margin-top:20px" id="testCount">${testAvailableCount('chapter','public')} questions available. Answers and explanations appear after submission.</div><div class="study-controls"><button class="btn" data-action="beginTest">Begin test →</button></div></section>`;
if(s.phase==='results')return testResults();let q=s.pool[s.index],choice=s.responses[q.id];return sessionHeader('Practice test',s.minutes?'Timed practice':'Untimed practice')+`<div class="row between"><span class="small">${Object.keys(s.responses).length} of ${s.pool.length} answered</span><span class="pill numbers" id="timerLabel">${timerText()}</span></div><div class="question-nav">${s.pool.map((q,i)=>`<button class="${s.responses[q.id]!==undefined?'answered':''} ${s.index===i?'current':''}" data-test-index="${i}" aria-label="Go to question ${i+1}">${i+1}</button>`).join('')}</div><section class="panel"><div class="row between"><span class="eyebrow muted">QUESTION ${s.index+1} OF ${s.pool.length}</span><span class="pill">Chapter ${q.chapter} · ${q.kind==='public'?'Adapted public question':'Original case'}</span></div><h2 class="question">${esc(q.question)}</h2>${questionOptions(q,choice,false,'test-answer')}${sourceHTML(q)}<div class="row between" style="margin-top:25px"><button class="btn secondary small-btn" data-action="prevTest" ${s.index===0?'disabled':''}>← Previous</button>${s.index<s.pool.length-1?`<button class="btn small-btn" data-action="nextTest">Next →</button>`:`<button class="btn small-btn" data-action="submitTest">Submit test</button>`}</div></section><div class="row between" style="margin-top:19px"><span class="small">Unanswered questions count as incorrect on submission.</span><button class="small" data-action="submitTest">Finish & review</button></div>`}
function testBank(scope,kind){let ids=scope==='all'?C.map(c=>c.id):scope==='unit'?C.filter(c=>c.unit===chapter().unit).map(c=>c.id):[S.chapter];return Q.filter(q=>ids.includes(q.chapter)&&(kind==='public'?q.kind==='public':kind==='missed'?S.answers[q.id]?.correct===false:true))}
function testAvailableCount(scope,kind){return testBank(scope,kind).length}
function timerText(){let s=session;if(!s?.started)return '';let t=s.minutes?Math.max(0,Math.ceil((s.deadline-Date.now())/1000)):Math.floor((Date.now()-s.started)/1000);return `${s.minutes?'Remaining':'Elapsed'} ${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}`}
function beginTest(){let scope=$('#testScope').value,kind=$('#testKind').value,length=Number($('#testLength').value),minutes=Number($('#testMinutes').value),pool=shuffled(testBank(scope,kind)).slice(0,length).map(shuffleQ);if(!pool.length){toast('No questions in that set. Change the scope or question bank.');return}session={mode:'test',phase:'running',pool,index:0,responses:{},minutes,started:Date.now(),deadline:Date.now()+minutes*60000};render();testTimer=setInterval(()=>{if(session?.mode!=='test'||session.phase!=='running'){clearInterval(testTimer);return}if($('#timerLabel'))$('#timerLabel').textContent=timerText();if(session.minutes&&Date.now()>=session.deadline)submitTest(true)},1000)}
function submitTest(expired=false){let s=session;if(s.phase!=='running')return;let missing=s.pool.length-Object.keys(s.responses).length;if(!expired&&missing&&!confirm(`${missing} unanswered question${missing===1?'':'s'} will count as incorrect. Submit now?`))return;clearInterval(testTimer);s.phase='results';s.expired=expired;s.correct=0;s.finished=Date.now();for(let q of s.pool){let choice=s.responses[q.id],correct=choice!==undefined&&q.choices[choice].original===q.correct;if(correct)s.correct++;recordAnswer(q,correct,choice!==undefined?q.choices[choice].text:null)}S.attempts.push({date:s.finished,correct:s.correct,total:s.pool.length,chapters:[...new Set(s.pool.map(q=>q.chapter))],public:s.pool.filter(q=>q.kind==='public').length});S.attempts=S.attempts.slice(-100);save();render()}
function testResults(){let s=session;return sessionHeader('Your practice review','Submitted test')+`<section class="panel"><div class="score-ring">${Math.round(100*s.correct/s.pool.length)}%</div><h2 style="text-align:center">${s.correct} of ${s.pool.length} correct</h2><p class="small" style="text-align:center">${s.expired?'Time expired · ':''}${Math.round((s.finished-s.started)/60000)} min · Review the mechanisms, then revisit missed ideas later.</p><div class="study-controls"><button class="btn" data-mode="test">Build another test</button><button class="btn secondary" data-nav="review">Review & saved terms</button></div></section>${s.pool.map((q,i)=>{let r=s.responses[q.id],correct=r!==undefined&&q.choices[r].original===q.correct;return `<section class="panel" style="margin-top:18px"><span class="pill ${correct?'green':''}">${correct?'Correct':'Revisit'} · Chapter ${q.chapter}</span><h3 style="margin:15px 0">${i+1}. ${esc(q.question)}</h3><p style="font-size:13px"><strong>Your answer:</strong> ${r===undefined?'Unanswered':esc(q.choices[r].text)}<br><strong>Correct answer:</strong> ${esc(q.options[q.correct])}</p><div class="feedback">${esc(q.explanation)}</div>${sourceHTML(q)}</section>`}).join('')}`}
function reviewView(){let d=G.filter(due),started=G.filter(touched),known=G.filter(established),missed=Q.filter(q=>S.answers[q.id]?.correct===false),bookmarked=G.filter(g=>S.bookmarks.includes(g.id));return `<div class="page-head"><div><div class="eyebrow muted">RETURN TO WHAT YOU'RE GROWING</div><h1 style="margin-top:10px">Review & saved terms</h1><p class="muted">Progress comes from retrieval over time.</p></div></div><div class="split"><section class="panel"><div class="row between"><h2>Ready for another look</h2><button class="btn small-btn" data-review-due="1">Review due terms</button></div>${d.length?`<div class="term-cloud">${d.slice(0,25).map(g=>`<button class="term-chip" data-term="${g.id}">${esc(termData(g).term)}</button>`).join('')}</div>`:`<p class="muted">Nothing is due right now. Start with a chapter, or come back when your next review is ready.</p>`}</section><section class="panel"><h2>Saved specimens</h2>${bookmarked.length?`<div class="term-cloud">${bookmarked.slice(0,30).map(g=>`<button class="term-chip" data-term="${g.id}">${esc(termData(g).term)}</button>`).join('')}</div><button class="btn secondary small-btn" style="margin-top:20px" data-review-saved="1">Practice saved terms</button>`:`<p class="muted">Save interesting or difficult terms from the glossary. They'll be gathered here.</p>`}</section></div><div class="section-head"><h2>Ideas to revisit</h2></div><section class="panel">${missed.length?missed.slice(0,25).map(q=>`<div class="review-item"><span class="small">Chapter ${q.chapter} · ${q.kind==='public'?'Public practice':'Concept case'}</span><h3>${esc(q.question)}</h3>${sourceHTML(q)}<details><summary>Review the explanation</summary><p style="font-size:13px;margin-top:10px"><strong>${esc(q.options[q.correct])}</strong> — ${esc(q.explanation)}</p>${sourceHTML(q)}</details><button class="btn small-btn secondary" style="margin-top:12px" data-retry-question="${q.id}">Retry this question</button></div>`).join(''):`<p class="muted">Missed quiz and test questions will appear here with their explanations.</p>`}</section><div class="section-head"><h2>Test history</h2></div><section class="panel">${S.attempts.length?S.attempts.slice(-10).reverse().map(a=>`<div class="review-item row between"><div><strong>${a.correct}/${a.total}</strong><span class="small"> · ${a.public} public-source questions</span><p class="small">Chapters ${a.chapters.join(', ')} · ${new Date(a.date).toLocaleDateString()}</p></div><span class="pill">${Math.round(a.correct/a.total*100)}%</span></div>`).join(''):`<p class="muted">Complete a practice test to start your history.</p>`}</section>${footer()}`}
function sourcesView(){let c=chapter();if(!c)return `<div class="page-head"><div><div class="eyebrow muted">READ, WATCH, EXPLORE</div><h1>Resources</h1><p class="muted">Choose a chapter for topic-matched reading, practice questions, and video collections.</p><button class="btn" data-nav="home">Choose a chapter →</button></div></div>${aboutView()}${footer()}`;return `<div class="page-head"><div><div class="eyebrow muted">FOLLOW THE EVIDENCE</div><h1 style="margin-top:10px">Your resource trail</h1><p class="muted">Chapter ${c.id} · ${esc(c.title)}</p></div></div><div class="split"><section class="panel"><h2>Read & practice</h2><a class="resource" href="https://openstax.org/books/biology-2e/pages/${c.os}-review-questions" target="_blank" rel="noopener"><strong>OpenStax Biology 2e · Chapter ${c.os} ↗</strong><span>Public review questions. This book uses different chapter numbering; the link is matched by topic.</span></a><a class="resource" href="https://www.pearson.com/channels/biology/textbook-solutions/campbell-12th-edition-978-0135188743" target="_blank" rel="noopener"><strong>Pearson's Campbell 12th edition directory ↗</strong><span>Textbook-linked explanations and exercises. Some content may require access.</span></a><a class="resource" href="https://biologyjunction.com/campbell-8th-edition-reading-gui/" target="_blank" rel="noopener"><strong>Biology Junction reading guides ↗</strong><span>Supplementary guides for an older Campbell edition. Check topic names against your course.</span></a></section><section class="panel"><h2>Watch & explain</h2><a class="resource" href="https://www.bozemanscience.com/biology/" target="_blank" rel="noopener"><strong>Bozeman Science · biology videos ↗</strong><span>A topic-based video collection. Look for ${esc(c.title.toLowerCase())}.</span></a><a class="resource" href="https://www.amoebasisters.com/playlist.html" target="_blank" rel="noopener"><strong>Amoeba Sisters · learning playlist ↗</strong><span>Visual introductions to biological mechanisms and vocabulary.</span></a><p class="notice" style="margin-top:18px">After a video, pause and explain one mechanism without looking. Then use the Concept lab and connection prompt.</p></section></div><section class="panel" style="margin-top:22px"><h2>Your chapter links</h2><p class="small">Add a course page, Quizlet set, or specific video. Links are bookmarks; their contents are not automatically imported or turned into questions.</p><div id="customLinks">${S.links.filter(l=>l.chapter===c.id).map(l=>`<a class="resource" href="${esc(l.url)}" target="_blank" rel="noopener"><strong>${esc(l.title)} ↗</strong><span>${esc(new URL(l.url).hostname)}</span></a>`).join('')}</div><form id="linkForm" style="margin-top:20px"><div class="row"><input class="field" name="title" placeholder="Resource title" aria-label="Resource title" required style="flex:1;min-width:160px"><input class="field" name="url" type="url" placeholder="https://…" aria-label="Resource URL" required style="flex:2;min-width:190px"><button class="btn" type="submit">Save link</button></div></form></section>${aboutView()}${footer()}`}
function aboutView(){return `<section class="panel" style="margin-top:22px"><h2>About Gen Bio Atlas</h2><p>${G.length.toLocaleString()} terms with independently written study explanations, 112 adapted OpenStax questions, 56 original application cases, and 56 connection prompts.</p><p class="small">Chapter names and topic links follow the general structure of Campbell Biology, 12th edition. They are suggested study groupings, not a verified publisher key-term checklist. Use your assigned chapter to check exam coverage.</p><p class="small">Original explanations are offered under CC BY 4.0. OpenStax question adaptations are CC BY-NC-SA 4.0, with sources shown beside each question. Linked videos and websites remain with their creators. This app is independent of Pearson and OpenStax.</p></section>`}
function settingsView(){let c=chapter();return `<div class="page-head"><div><div class="eyebrow muted">KEEP YOUR DISCOVERIES</div><h1 style="margin-top:10px">My notebook</h1><p class="muted">Your notes, your pace, your study record.</p></div></div><div class="row" style="margin-bottom:24px"><button class="btn secondary" data-nav="review">Review & saved terms →</button></div><div class="split">${c?`<section class="panel"><h2>Chapter ${c.id} notes</h2><p class="small">Questions for class, tricky distinctions, and examples that helped.</p><textarea class="field" id="chapterNotes" placeholder="What clicked? What needs another look?" style="margin-top:17px;min-height:220px">${esc(S.notes[c.id]||'')}</textarea><span class="small">Saves as you type.</span></section>`:`<section class="panel"><h2>Chapter notes</h2><p class="muted">Choose a chapter to write or revisit your notes.</p><button class="btn secondary" data-nav="home">Choose a chapter</button></section>`}<section class="panel"><h2>Carry your progress with you</h2><p class="muted" style="font-size:13px">This app runs without an account. Your browser stores reviews, notes, glossary corrections, and test history. Export before switching browsers, moving the file, or clearing browser data.</p><div class="row" style="margin-top:20px"><button class="btn" data-action="exportProgress">Export progress</button><button class="btn secondary" data-action="importProgress">Import backup</button></div><p class="small" style="margin-top:18px">Imports replace the current local record after confirmation. They do not change the built-in question bank.</p><button class="btn small-btn secondary" style="margin-top:20px" data-action="exportGlossary">Export study glossary</button><p class="small" style="margin-top:7px">JSON includes your corrections and chapter links.</p></section></div><section class="panel" style="margin-top:22px"><h2>How the learning loop works</h2><div class="chapter-list" style="margin-top:17px"><p style="font-size:13px"><strong>Vocabulary:</strong> recall unaided, reveal the definition, and rate honestly. A miss returns in about 10 minutes; successful recalls schedule progressively longer intervals.</p><p style="font-size:13px"><strong>Concepts:</strong> the first answer in each attempt is recorded. Retakes update the latest result and increase the attempt count. Practice tests preserve each submitted score in history.</p><p style="font-size:13px"><strong>Connections:</strong> write a causal explanation before viewing the checklist. These reflections are self-assessed; the app does not pretend to automatically grade prose.</p><p style="font-size:13px"><strong>Glossary:</strong> press / to open search, or use the persistent search button. Entries can be bookmarked, corrected, and assigned to chapters.</p></div></section>${footer()}`}
function exportJSON(name,obj){let url=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}));let a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function openGloss(id=null,scope=null){returnFocus=document.activeElement;$('#glossary').classList.add('open');document.body.style.overflow='hidden';if(scope)$('#glossScope').value=scope;glossLetter='';glossLimit=100;if(id){$('#glossSearch').value='';$('#glossScope').value='all';glossTerm=id}else glossTerm=null;renderAlphabet();renderGloss();$('#glossSearch').focus()}
function closeGloss(){$('#glossary').classList.remove('open');document.body.style.overflow='';if(returnFocus?.isConnected)returnFocus.focus()}
function renderAlphabet(){$('#alphabet').innerHTML=['','0',...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'].map(l=>`<button class="${l===glossLetter?'active':''}" data-letter="${l}">${l||'All'}</button>`).join('')}
function glossaryFiltered(){let query=norm($('#glossSearch').value),scope=$('#glossScope').value;return G.filter(g=>{let e=termData(g),term=norm(e.term);return(scope==='all'||scope==='chapter'&&e.chapters.includes(S.chapter)||scope==='saved'&&S.bookmarks.includes(g.id))&&(!glossLetter||(glossLetter==='0'?/^[0-9]/.test(term):term.startsWith(glossLetter.toLowerCase())))&&(!query||norm(`${e.term} ${e.definition}`).includes(query))}).sort((a,b)=>{if(!query)return 0;let at=norm(termData(a).term),bt=norm(termData(b).term);return Number(bt===query)-Number(at===query)||Number(bt.startsWith(query))-Number(at.startsWith(query))})}
function renderGloss(){let list=glossaryFiltered();if(!list.some(g=>g.id===glossTerm))glossTerm=list[0]?.id||null;$('#glossResults').innerHTML=`<div class="gloss-count">${list.length.toLocaleString()} entries · ${G.length.toLocaleString()} total</div>`+list.slice(0,glossLimit).map(g=>`<button class="gloss-result ${g.id===glossTerm?'active':''}" data-gloss-id="${g.id}">${esc(termData(g).term)}${S.bookmarks.includes(g.id)?' ☆':''}</button>`).join('')+(list.length>glossLimit?`<button class="btn secondary small-btn" data-action="moreGloss" style="margin:10px">Show more entries</button>`:'');renderGlossDetail()}
function renderGlossDetail(){$('#glossDetail').scrollTop=0;if(!glossTerm){$('#glossDetail').innerHTML=`<div class="empty">No matching terms. Try another spelling or search all entries.</div>`;return}let raw=getTerm(glossTerm),e=termData(raw),saved=S.bookmarks.includes(e.id);$('#glossDetail').innerHTML=`<div class="row between" style="margin:0"><span class="eyebrow muted"><span class="app-name">Gen Bio Atlas</span> · STUDY EXPLANATION</span><button class="btn secondary small-btn" data-action="bookmark">${saved?'★ Saved':'☆ Save term'}</button></div><h2>${esc(e.term)}</h2><p class="definition">${esc(e.definition)}</p>${e.aliasOf?`<button class="btn secondary small-btn" style="margin-top:16px" data-alias="${esc(e.aliasOf)}">Open ${esc(e.aliasOf)} →</button>`:''}${e.note?`<p class="notice warn" style="margin-top:17px">${esc(e.note)}</p>`:''}${S.edits[e.id]?`<p class="small" style="margin-top:10px">Includes your saved correction.</p>`:''}<div class="row">${e.chapters.map(n=>`<button class="pill" data-gloss-chapter="${n}">Ch. ${n} · ${esc(C[n-1].title)}</button>`).join('')}</div><p class="small" style="margin-top:10px">Suggested chapter links; edit these to match your course.</p><details><summary>Edit wording or chapter links</summary><form id="editTermForm"><label class="field-label" style="margin-top:12px">Term<input class="field" name="term" value="${esc(e.term)}" required></label><label class="field-label">Definition<textarea class="field" name="definition" required>${esc(e.definition)}</textarea></label><label class="field-label">Chapter numbers, separated by commas<input class="field" name="chapters" value="${e.chapters.join(', ')}" required></label><button class="btn small-btn" type="submit" style="margin-top:12px">Save correction</button> <button class="small" type="button" data-action="resetTerm">Restore original explanation</button></form></details><div class="source">Independently written Gen Bio Atlas explanation · CC BY 4.0. Suggested chapter links can be adjusted for your course.</div>`;}
function leaveSession(){return !(session?.mode==='test'&&session.phase==='running')||confirm('Leave this unfinished test? Its answers have not been submitted.')}
document.addEventListener('click',ev=>{let b=ev.target.closest('button');if(!b||b.disabled)return;const d=b.dataset;
if(d.nav){if(leaveSession())nav(d.nav);return}
if(d.chapter){if(!leaveSession())return;setChapter(d.chapter);nav('chapter');return}
if(d.mode){if(leaveSession())startMode(d.mode);return}
if(d.unit){unitFilter=Number(d.unit);render();return}
if(d.term){openGloss(d.term);return}
if(d.scope){makeVocab(session.mode,d.scope);render();return}
if(d.rate){if((session.mode==='cards'&&!session.revealed)||(session.mode==='recall'&&!session.graded))return;rateTerm(d.rate);return}
if(d.matchLeft){chooseMatch('left',d.matchLeft);return}if(d.matchRight){chooseMatch('right',d.matchRight);return}
if(d.answer!==undefined){let s=session;if(s.graded)return;s.selected=Number(d.answer);s.graded=true;let q=s.pool[s.index],ok=q.choices[s.selected].original===q.correct;if(ok)s.correct++;recordAnswer(q,ok,q.choices[s.selected].text);render();return}
if(d.testAnswer!==undefined){let s=session;if(s.phase!=='running')return;s.responses[s.pool[s.index].id]=Number(d.testAnswer);render();return}
if(d.testIndex!==undefined){session.index=Number(d.testIndex);render();return}
if(d.reviewDue){startMode('cards','due');return}if(d.reviewSaved){startMode('cards','saved');return}
if(d.retryQuestion){let q=Q.find(q=>q.id===d.retryQuestion);setChapter(q.chapter);page='study';session={mode:'concept',pool:[shuffleQ(q)],index:0,selected:null,graded:false,correct:0};render();window.scrollTo(0,0);return}
if(d.glossId){glossTerm=d.glossId;renderGloss();return}
if(d.letter!==undefined){glossLetter=d.letter;glossLimit=100;renderAlphabet();renderGloss();return}
if(d.alias){let g=G.find(g=>norm(g.term)===norm(d.alias));if(g){glossTerm=g.id;$('#glossSearch').value=g.term;glossLetter='';renderAlphabet();renderGloss()}return}
if(d.glossChapter){if(!leaveSession())return;setChapter(d.glossChapter);closeGloss();nav('chapter');return}
switch(d.action){
case 'glossary':openGloss();break;case 'chapterGloss':openGloss(null,'chapter');break;case 'closeGloss':closeGloss();break;
case 'reveal':session.revealed=true;render();break;case 'giveUp':checkRecall('');break;
case 'newMatch':newMatch();render();break;case 'nextConcept':session.index++;session.selected=null;session.graded=false;render();break;
case 'revealBridge':{let text=$('#bridgeAnswer').value.trim();if(text.length<15){toast('Write a short explanation first, then compare it with the guide.');$('#bridgeAnswer').focus();return}session.revealed=true;render();break}
case 'beginTest':beginTest();break;case 'prevTest':session.index=Math.max(0,session.index-1);render();break;case 'nextTest':session.index=Math.min(session.pool.length-1,session.index+1);render();break;case 'submitTest':submitTest();break;
case 'moreGloss':glossLimit+=100;renderGloss();break;
case 'bookmark':if(S.bookmarks.includes(glossTerm))S.bookmarks=S.bookmarks.filter(id=>id!==glossTerm);else S.bookmarks.push(glossTerm);save();renderGloss();if(page==='review')render();break;
case 'resetTerm':delete S.edits[glossTerm];save();renderGloss();break;
case 'exportProgress':exportJSON('Gen_Bio_Atlas_Progress.json',S);toast('Progress backup downloaded.');break;
case 'importProgress':$('#importProgress').click();break;
case 'exportGlossary':exportJSON('Gen_Bio_Atlas_Study_Glossary.json',{title:'Gen Bio Atlas study glossary',notice:'Original study explanations, CC BY 4.0; suggested chapter links. Personal edits are included.',entries:G.map(termData)});break;
}
});
document.addEventListener('submit',ev=>{let f=ev.target;if(f.id==='recallForm'){ev.preventDefault();checkRecall($('#recallAnswer').value)}if(f.id==='linkForm'){ev.preventDefault();let data=new FormData(f),url;try{url=new URL(data.get('url'));if(!['https:','http:'].includes(url.protocol))throw Error()}catch(e){toast('Use an https:// or http:// web link.');return}S.links.push({chapter:S.chapter,title:String(data.get('title')).slice(0,160),url:url.href});save();render();toast('Resource saved for this chapter.')}if(f.id==='editTermForm'){ev.preventDefault();let data=new FormData(f),chapters=[...new Set(String(data.get('chapters')).split(',').map(x=>Number(x.trim())))];if(!chapters.length||chapters.some(n=>!Number.isInteger(n)||n<1||n>56)){toast('Enter chapter numbers from 1 to 56, separated by commas.');return}let term=String(data.get('term')).trim(),definition=String(data.get('definition')).trim();if(!term||!definition)return;S.edits[glossTerm]={term,definition,chapters};save();renderGloss();toast('Your correction is saved in this browser.')}});
document.addEventListener('input',ev=>{let el=ev.target;if(el.id==='glossSearch'){glossLimit=100;renderGloss()}if(el.id==='chapterSearch'){chapterQuery=el.value;let list=C.filter(c=>(unitFilter<0||c.unit===unitFilter)&&norm(`${c.id} ${c.title} ${c.goal}`).includes(norm(chapterQuery)));$('#chapterResults').innerHTML=chapterResults(list)}if(el.id==='bridgeAnswer'){let old=S.bridges[S.chapter]||{checks:[]};S.bridges[S.chapter]={...old,text:el.value};save()}if(el.id==='chapterNotes'){S.notes[S.chapter]=el.value;save()}});
document.addEventListener('change',ev=>{let el=ev.target;if(el.id==='chapterSelect'){if(!leaveSession()){el.value=S.chapter;return}setChapter(el.value);nav('chapter')}if(el.id==='glossScope'){glossLimit=100;renderGloss()}if(el.dataset.rubric!==undefined){let n=Number(el.dataset.rubric),b=S.bridges[S.chapter]||{text:'',checks:[]};b.checks=el.checked?[...new Set([...b.checks,n])]:b.checks.filter(x=>x!==n);S.bridges[S.chapter]=b;save();render()}if(['testScope','testKind'].includes(el.id))$('#testCount').textContent=`${testAvailableCount($('#testScope').value,$('#testKind').value)} questions available. Answers and explanations appear after submission.`});
$('#glossary').addEventListener('click',e=>{if(e.target===$('#glossary'))closeGloss()});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&$('#glossary').classList.contains('open')){closeGloss();return}if(ev.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){ev.preventDefault();openGloss()}if(ev.key==='Tab'&&$('#glossary').classList.contains('open')){let focusable=$$('#glossary button:not(:disabled),#glossary input,#glossary select,#glossary textarea,#glossary a[href]').filter(el=>el.getClientRects().length),first=focusable[0],last=focusable[focusable.length-1];if(ev.shiftKey&&document.activeElement===first){ev.preventDefault();last?.focus()}else if(!ev.shiftKey&&document.activeElement===last){ev.preventDefault();first?.focus()}}});
function validBackup(x){if(!x||x.version!==1||(x.chapter!==null&&(!Number.isInteger(x.chapter)||x.chapter<1||x.chapter>56)))return false;for(let k of ['terms','answers','bridges','edits','notes'])if(!x[k]||typeof x[k]!=='object'||Array.isArray(x[k]))return false;for(let k of ['attempts','bookmarks','links'])if(!Array.isArray(x[k]))return false;if(x.bookmarks.some(id=>typeof id!=='string'||!getTerm(id)))return false;if(x.links.some(l=>{try{return typeof l.title!=='string'||!['https:','http:'].includes(new URL(l.url).protocol)||!Number.isInteger(l.chapter)||l.chapter<1||l.chapter>56}catch(e){return true}}))return false;for(let [id,e] of Object.entries(x.edits)){if(!getTerm(id)||typeof e.term!=='string'||typeof e.definition!=='string'||!Array.isArray(e.chapters)||!e.chapters.length||e.chapters.some(n=>!Number.isInteger(n)||n<1||n>56))return false}for(let e of Object.values(x.terms)){if(!Number.isFinite(e.level)||e.level<0||e.level>4||!Number.isFinite(e.due))return false}for(let a of x.attempts){if(!Number.isFinite(a.correct)||!Number.isFinite(a.total)||a.total<=0||!Array.isArray(a.chapters)||!Number.isFinite(a.date))return false}for(let b of Object.values(x.bridges)){if(typeof b.text!=='string'||!Array.isArray(b.checks)||b.checks.some(n=>![0,1,2].includes(n)))return false}return true}
$('#importProgress').addEventListener('change',async ev=>{try{let file=ev.target.files[0];if(!file)return;if(file.size>15000000)throw Error();let x=JSON.parse(await file.text());if(!validBackup(x))throw Error();if(!confirm('Replace this browser’s progress with the selected backup? Export your current record first if you want to keep both.'))return;S={...fresh(),...x};save();$('#chapterSelect').value=S.chapter||'';nav('settings');toast('Progress, notes, and corrections restored.')}catch(e){toast('That file is not a valid Gen Bio Atlas progress backup. No data was changed.')}finally{ev.target.value=''}});
render();
</script></body></html>
